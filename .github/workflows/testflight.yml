name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number (must increase for every upload)
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  archive-and-upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.gamedevplayable.ttte
      PROFILE_NAME: 2048 App Store
      KEYCHAIN_PASSWORD: temporary-build-keychain-password
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate source
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Install distribution certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          sed -i '' "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = $TEAM_ID;/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/iPhone Developer/Apple Distribution/g' ios/Runner.xcodeproj/project.pbxproj
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Create App Store export options
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              'destination': 'export',
              'manageAppVersionAndBuildNumber': False,
              'method': 'app-store-connect',
              'provisioningProfiles': {
                  os.environ['APP_BUNDLE_ID']: os.environ['PROFILE_NAME'],
              },
              'signingCertificate': 'Apple Distribution',
              'signingStyle': 'manual',
              'stripSwiftSymbols': True,
              'teamID': os.environ['APPLE_TEAM_ID'],
              'uploadSymbols': True,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as output:
              plistlib.dump(options, output)
          PY

      - name: Build signed IPA
        run: >-
          flutter build ipa --release
          --build-name 1.0.0
          --build-number "${{ inputs.build_number }}"
          --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_PRIVATE_KEY" > "$PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2048-ios-${{ inputs.build_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 14
