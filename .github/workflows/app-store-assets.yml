name: App Store Assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iPhone simulator app
        run: |
          flutter pub get
          flutter build ios --simulator --debug
      - name: Boot 6.9-inch iPhone simulator
        run: |
          DEVICE_UDID=$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          candidates = [device for runtime in devices.values() for device in runtime if 'iPhone 16 Pro Max' in device['name']]
          if not candidates:
              candidates = [device for runtime in devices.values() for device in runtime if 'Pro Max' in device['name']]
          if not candidates:
              raise SystemExit('No iPhone Pro Max simulator is available')
          print(candidates[-1]['udid'])
          PY
          )
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl status_bar "$DEVICE_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$DEVICE_UDID" build/ios/iphonesimulator/Runner.app
      - name: Capture live iPhone screenshots
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          mkdir -p app-store-screenshots
          xcrun simctl launch "$DEVICE_UDID" com.gamedevplayable.ttte
          sleep 5
          xcrun simctl io "$DEVICE_UDID" screenshot app-store-screenshots/01-classic-board.png
          maestro --device "$DEVICE_UDID" test scripts/store-screenshots.yaml || {
            echo "Retrying after simulator driver startup failure"
            xcrun simctl shutdown "$DEVICE_UDID" || true
            xcrun simctl boot "$DEVICE_UDID"
            xcrun simctl bootstatus "$DEVICE_UDID" -b
            xcrun simctl install "$DEVICE_UDID" build/ios/iphonesimulator/Runner.app
            maestro --device "$DEVICE_UDID" test scripts/store-screenshots.yaml || echo "Maestro unavailable; keeping the verified native launch screenshot"
          }
          for name in 01-classic-board 02-smooth-gameplay 03-build-your-best-score; do
            SOURCE=$(find "$HOME/.maestro" -type f -name "$name.png" -print -quit 2>/dev/null || true)
            if [ -n "$SOURCE" ]; then
              cp "$SOURCE" "app-store-screenshots/$name.png"
            fi
          done
          file app-store-screenshots/*.png
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: app-store-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
