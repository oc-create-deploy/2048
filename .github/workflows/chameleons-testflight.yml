name: Chameleons MC TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number
        required: true
        default: '1'
      upload:
        description: Upload after visual review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chameleons-testflight
  cancel-in-progress: false

jobs:
  archive-and-upload:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      APP_BUNDLE_ID: com.gameplay.chameleons
      KEYCHAIN_PASSWORD: temporary-motion-camera-keychain-password
    steps:
      - name: Check out Chameleons MC
        uses: actions/checkout@v4
        with:
          repository: oc-create-deploy/chameleons
          ssh-key: ${{ secrets.CHAMELEONS_REPO_DEPLOY_KEY }}
          persist-credentials: false
          ref: 69aff10b9efdb21e353291309409f243be0d3fd5
          path: app

      - name: Generate native project and validate
        timeout-minutes: 15
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen generate
          npm ci --prefix server
          npm test --prefix server
          npm run smoke --prefix server -- wss://chameleons-mc.129-146-96-23.sslip.io/ws
          swift test
          xcodebuild build -project ChameleonsMC.xcodeproj -scheme ChameleonsMC \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Simulator online room and painter smoke
        timeout-minutes: 20
        working-directory: app
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPhone" in v["name"]))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -project ChameleonsMC.xcodeproj -scheme ChameleonsMC \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:ChameleonsMCUITests -resultBundlePath "$RUNNER_TEMP/GameSmoke.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/GameSmoke.xcresult" --output-path "$RUNNER_TEMP/game-screenshots"

      - name: Collect simulator diagnostics and attachments
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/game-screenshots"
          if [ -d "$RUNNER_TEMP/GameSmoke.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/GameSmoke.xcresult" --output-path "$RUNNER_TEMP/game-screenshots" || true
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/GameSmoke.xcresult" > "$RUNNER_TEMP/game-screenshots/tests.json" || true
          fi
          cp -R "$HOME/Library/Logs/DiagnosticReports" "$RUNNER_TEMP/game-screenshots/host-crashes" || true
          if [ -n "$SIMULATOR_ID" ]; then
            cp -R "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_ID/data/Library/Logs/CrashReporter" "$RUNNER_TEMP/game-screenshots/simulator-crashes" || true
            xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/game-screenshots/final-screen.png" || true
          fi

      - name: Save simulator visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chameleons-simulator-screenshots
          path: ${{ runner.temp }}/game-screenshots
          retention-days: 3

      - name: Verify App Store destination and create provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          if ! openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/distribution.pem"; then
            openssl pkcs12 -legacy -in "$CERTIFICATE_PATH" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/distribution.pem"
          fi
          export CERTIFICATE_SERIAL=$(openssl x509 -in "$RUNNER_TEMP/distribution.pem" -noout -serial | cut -d= -f2)
          export CERTIFICATE_PATH PROFILE_PATH
          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          def make_token():
              now = int(time.time())
              return jwt.encode(
                  {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                  os.environ["ASC_PRIVATE_KEY"],
                  algorithm="ES256",
                  headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
              )

          def request(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  data=data,
                  method=method,
                  headers={"Authorization": f"Bearer {make_token()}", "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode()
                  raise RuntimeError(f"App Store Connect {method} {path} failed ({error.code}): {detail}") from error

          identifier = urllib.parse.quote(os.environ["APP_BUNDLE_ID"], safe="")
          apps = request("GET", f"/v1/apps?filter%5BbundleId%5D={identifier}&limit=2").get("data", [])
          if len(apps) != 1:
              raise RuntimeError(f"Expected one App Store app for {os.environ['APP_BUNDLE_ID']}, found {len(apps)}")
          app_id = apps[0]["id"]
          print(f"Confirmed App Store app: {apps[0]['attributes']['name']} ({app_id})")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"APP_STORE_APP_ID={app_id}\n")

          bundle_records = request("GET", f"/v1/bundleIds?filter%5Bidentifier%5D={identifier}&limit=2").get("data", [])
          if len(bundle_records) != 1:
              raise RuntimeError(f"Expected one bundle ID record for {os.environ['APP_BUNDLE_ID']}")
          bundle_id = bundle_records[0]["id"]

          certificates = request("GET", "/v1/certificates?limit=200").get("data", [])
          wanted_serial = os.environ["CERTIFICATE_SERIAL"].upper().lstrip("0")
          certificate = next(
              (
                  item for item in certificates
                  if str(item.get("attributes", {}).get("serialNumber", "")).upper().lstrip("0") == wanted_serial
                  and item.get("attributes", {}).get("certificateType") in {"IOS_DISTRIBUTION", "DISTRIBUTION"}
              ),
              None,
          )
          if certificate is None:
              raise RuntimeError("The installed distribution certificate was not found in App Store Connect")

          profile_name = f"Chameleons MC App Store {os.environ['GITHUB_RUN_ID']}"
          profile = request(
              "POST",
              "/v1/profiles",
              {
                  "data": {
                      "type": "profiles",
                      "attributes": {"name": profile_name, "profileType": "IOS_APP_STORE"},
                      "relationships": {
                          "bundleId": {"data": {"type": "bundleIds", "id": bundle_id}},
                          "certificates": {"data": [{"type": "certificates", "id": certificate["id"]}]},
                      },
                  }
              },
          )["data"]
          content = profile.get("attributes", {}).get("profileContent")
          if not content:
              raise RuntimeError("App Store Connect returned a profile without profileContent")
          with open(os.environ["PROFILE_PATH"], "wb") as output:
              output.write(base64.b64decode(content))
          print(f"Created provisioning profile: {profile_name}")
          PY

      - name: Install signing identity and profile
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          export PROFILE_NAME TEAM_ID
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Create App Store export options
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "destination": "export",
              "manageAppVersionAndBuildNumber": False,
              "method": "app-store-connect",
              "provisioningProfiles": {os.environ["APP_BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
              "signingCertificate": "Apple Distribution",
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "teamID": os.environ["APPLE_TEAM_ID"],
              "uploadSymbols": True,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as output:
              plistlib.dump(options, output)
          PY

      - name: Build signed IPA
        working-directory: app
        run: |
          xcodebuild archive -project ChameleonsMC.xcodeproj -scheme ChameleonsMC \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ChameleonsMC.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" TARGETED_DEVICE_FAMILY=1 \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          python3 - <<'PYCODE'
          import os, plistlib
          path = os.path.join(os.environ['RUNNER_TEMP'], 'ChameleonsMC.xcarchive/Products/Applications/ChameleonsMC.app/Info.plist')
          with open(path, 'rb') as source:
              info = plistlib.load(source)
          assert info['CFBundleIdentifier'] == 'com.gameplay.chameleons', info['CFBundleIdentifier']
          assert info['UIDeviceFamily'] == [1], info.get('UIDeviceFamily')
          assert info['ITSAppUsesNonExemptEncryption'] is False
          assert info['ChameleonsServerURL'] == 'wss://chameleons-mc.129-146-96-23.sslip.io/ws'
          print('Archive identity, iPhone-only device family, and export compliance verified')
          PYCODE
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ChameleonsMC.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/ios/ipa

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        working-directory: app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_PRIVATE_KEY" > "$PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Wait for Apple processing
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          EXPECTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          import jwt

          def make_token():
              now = int(time.time())
              return jwt.encode(
                  {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                  os.environ["ASC_PRIVATE_KEY"],
                  algorithm="ES256",
                  headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
              )

          params = urllib.parse.urlencode({
              "filter[app]": os.environ["APP_STORE_APP_ID"],
              "filter[version]": os.environ["EXPECTED_BUILD_NUMBER"],
              "limit": 1,
          })
          deadline = time.time() + 2400
          while time.time() < deadline:
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1/builds?" + params,
                  headers={"Authorization": f"Bearer {make_token()}"},
              )
              with urllib.request.urlopen(req) as response:
                  builds = json.load(response).get("data", [])
              if builds:
                  attributes = builds[0]["attributes"]
                  state = attributes.get("processingState")
                  compliance = attributes.get("usesNonExemptEncryption")
                  print(f"Apple processing state: {state}; usesNonExemptEncryption={compliance}", flush=True)
                  if state == "VALID" and compliance is False:
                      raise SystemExit(0)
                  if state in {"FAILED", "INVALID"}:
                      raise RuntimeError(f"Apple processing ended in {state}")
              time.sleep(30)
          raise TimeoutError("Apple did not finish processing within 40 minutes")
          PY
