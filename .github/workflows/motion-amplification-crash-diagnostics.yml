name: Motion Amplification Crash Diagnostics

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number
        required: true
        default: '12'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect TestFlight crash diagnostics
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_STORE_APP_ID: '6815931755'
          EXPECTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography
          mkdir -p "$RUNNER_TEMP/crash-diagnostics"
          OUTPUT_DIR="$RUNNER_TEMP/crash-diagnostics" "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          def token():
              now = int(time.time())
              return jwt.encode(
                  {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                  os.environ["ASC_PRIVATE_KEY"],
                  algorithm="ES256",
                  headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
              )

          def get(path):
              request = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  headers={"Authorization": f"Bearer {token()}"},
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode()
                  raise RuntimeError(f"GET {path} failed ({error.code}): {detail}") from error

          output_dir = os.environ["OUTPUT_DIR"]
          params = urllib.parse.urlencode({
              "filter[app]": os.environ["APP_STORE_APP_ID"],
              "filter[version]": os.environ["EXPECTED_BUILD_NUMBER"],
              "limit": 1,
          })
          builds = get("/v1/builds?" + params).get("data", [])
          if len(builds) != 1:
              raise RuntimeError(f"Expected one indexed build, found {len(builds)}")
          build_id = builds[0]["id"]

          crash_params = urllib.parse.urlencode({
              "filter[build]": build_id,
              "fields[betaFeedbackCrashSubmissions]": (
                  "createdDate,deviceModel,osVersion,architecture,appUptimeInMilliseconds,"
                  "diskBytesAvailable,diskBytesTotal,batteryPercentage,appPlatform,devicePlatform,"
                  "deviceFamily,buildBundleId,crashLog,build"
              ),
              "sort": "-createdDate",
              "limit": 50,
          })
          crashes = get(f"/v1/apps/{os.environ['APP_STORE_APP_ID']}/betaFeedbackCrashSubmissions?{crash_params}")
          with open(os.path.join(output_dir, "submissions.json"), "w", encoding="utf-8") as handle:
              json.dump(crashes, handle, indent=2)
          for item in crashes.get("data", []):
              crash_id = item["id"]
              log = get(f"/v1/betaFeedbackCrashSubmissions/{crash_id}/crashLog?fields%5BbetaCrashLogs%5D=logText")
              with open(os.path.join(output_dir, f"crash-{crash_id}.json"), "w", encoding="utf-8") as handle:
                  json.dump(log, handle, indent=2)

          signatures = get(f"/v1/builds/{build_id}/diagnosticSignatures?limit=200")
          with open(os.path.join(output_dir, "diagnostic-signatures.json"), "w", encoding="utf-8") as handle:
              json.dump(signatures, handle, indent=2)
          print(json.dumps({
              "buildId": build_id,
              "betaCrashSubmissions": len(crashes.get("data", [])),
              "diagnosticSignatures": len(signatures.get("data", [])),
          }, indent=2))
          PY

      - name: Upload crash diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: motion-amplification-build-${{ inputs.build_number }}-crashes
          path: ${{ runner.temp }}/crash-diagnostics
          if-no-files-found: error
          retention-days: 7
