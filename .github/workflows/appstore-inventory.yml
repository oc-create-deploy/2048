name: App Store Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/appstore-inventory.yml

permissions:
  contents: read

jobs:
  list-apps:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: List App Store Connect apps
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
          import os, time, json, urllib.request
          import jwt

          token = jwt.encode(
              {
                  "iss": os.environ["ASC_ISSUER_ID"],
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 900,
                  "aud": "appstoreconnect-v1",
              },
              os.environ["ASC_PRIVATE_KEY"],
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )
          url = "https://api.appstoreconnect.apple.com/v1/apps?limit=200"
          apps = []
          while url:
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              apps.extend(payload.get("data", []))
              url = payload.get("links", {}).get("next")

          print("APP_STORE_CONNECT_APPS")
          for app in sorted(apps, key=lambda item: item["attributes"]["name"].lower()):
              attrs = app["attributes"]
              print("\t".join([attrs["name"], attrs["bundleId"], app["id"], attrs.get("sku", "")]))
          PY
